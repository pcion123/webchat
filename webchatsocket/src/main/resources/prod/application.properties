spring.application.name=webchatsocket

server.address=0.0.0.0
server.port=${WEBCHAT_SOCKET_PORT:9092}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/webchat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:webuser}
spring.datasource.password=${MYSQL_PASSWORD:webpass}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.springtest.webchatsocket.model.entity
mybatis.configuration.map-underscore-to-camel-case=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:webuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:webpass}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

webchat.rabbitmq.server-push.exchange=webchat.server-push.topic
webchat.rabbitmq.server-push.routing-pattern=server-push.webchatsocket.#
webchat.rabbitmq.server-push.queue-prefix=webchatsocket.push
webchat.rabbitmq.server-push.listener-auto-startup=true
webchat.socket.node-id=${WEBCHAT_SOCKET_NODE_ID:local}

webchat.jwt.issuer=webchatapi
webchat.jwt.audience=webchatsocket
webchat.jwt.secret=${WEBCHAT_JWT_SECRET:webchat-dev-jwt-secret-32-bytes-minimum}
webchat.jwt.access-token-ttl=PT24H